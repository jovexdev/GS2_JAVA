spring.application.name=aegis
server.address=127.0.0.1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.mvc.problemdetails.enabled=true

aegis.db.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
aegis.db.usuario=${DB_USUARIO:}
aegis.db.senha=${DB_SENHA:}
aegis.db.driver=oracle.jdbc.OracleDriver
aegis.openai.api-key=${OPENAI_API_KEY:}
aegis.openai.model=${OPENAI_MODEL:gpt-5.6-terra}
aegis.gestor.email=${AEGIS_GESTOR_EMAIL:}
aegis.gestor.senha=${AEGIS_GESTOR_SENHA:}
aegis.agente.email=${AEGIS_AGENTE_EMAIL:}
aegis.agente.senha=${AEGIS_AGENTE_SENHA:}
