spring.application.name=aegis
spring.config.import=optional:file:./aegis.local.properties
server.address=127.0.0.1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.mvc.problemdetails.enabled=true

aegis.db.url=${DB_URL:}
aegis.db.usuario=${DB_USUARIO:}
aegis.db.senha=${DB_SENHA:}
aegis.db.driver=oracle.jdbc.driver.OracleDriver
aegis.openai.api-key=${OPENAI_API_KEY:}
aegis.openai.model=${OPENAI_MODEL:}
aegis.gestor.email=${AEGIS_GESTOR_EMAIL:}
aegis.gestor.senha=${AEGIS_GESTOR_SENHA:}
aegis.agente.email=${AEGIS_AGENTE_EMAIL:}
aegis.agente.senha=${AEGIS_AGENTE_SENHA:}
